name: Aikido Release Gating
on:
  release:
    types: [published, created]

jobs:
  aikido-release-scan:
    runs-on: ubuntu-latest
    container:
      image: aikidosecurity/local-scanner:latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          path: my-repo

      - name: Run Aikido Release Gating
        run: |
          aikido-local-scanner scan my-repo \
            --apikey ${{ secrets.AIKIDO_API_KEY }} \
            --repositoryname "DaBeastApp" \
            --branchname main \
            --fail-on high \
            --force-create-repository-for-branch
